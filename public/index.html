<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Habit Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Habit Tracker</h1>

    <!-- Form to create a new habit -->
    <form id="habit-form">
        <input type="text" id="habit-name" placeholder="Nombre del hábito" required>
        <select id="habit-type" required>
            <option value="">-- Tipo --</option>
            <option value="deporte">Salud</option>
            <option value="estudio">Profesional</option>
            <option value="social">Social</option>
            <option value="ocio">Ocio</option>
        </select>
        <button type="submit">Crear hábito</button>
    </form>

    <!-- List existing habits -->
    <ul id="habit-list"></ul>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Habit Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="page">
        <header>
            <h1>Habit Tracker</h1>
            <p class="tagline">Registra tu progreso diario.</p>
        </header>

        <form id="habit-form">
            <input type="text" id="habit-name" placeholder="Nombre del hábito" required>
            <select id="habit-type" required>
                <option value="">-- Tipo --</option>
                <option value="salud">Salud</option>
                <option value="estudio">Estudio</option>
                <option value="social">Social</option>
                <option value="ocio">Ocio</option>
            </select>
            <button type="submit">Crear hábito</button>
        </form>

        <ul id="habit-list"></ul>
        <div class="stats-card">
            <a href="stats.html" class="stats-link">Ver estadísticas →</a>
        </div>
    
        <div class='calendar-card'>
            <h2><p style="text-align: center;">Calendario de hábitos</p></h2>
            <p class="tagline" style="text-align: center;">Este es tu progreso de los últimos 30 días</p>
            <div id="calendar" class="calendar-grid"></div>
            <div class="calendar-legend">
                <span>Menos</span>
                <span class="legend-swatch level-0"></span>
                <span class="legend-swatch level-1"></span>
                <span class="legend-swatch level-2"></span>
                <span class="legend-swatch level-3"></span>
                <span>Más</span>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/app.js"></script>
</body>
</html>

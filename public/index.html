<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Habit Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="page">
        <header>
            <h1>Habit Tracker</h1>
            <p class="tagline">Un hábito a la vez, cada día.</p>
        </header>

        <form id="habit-form">
            <input type="text" id="habit-name" placeholder="Nombre del hábito" required>
            <select id="habit-type" required>
                <option value="">-- Tipo --</option>
                <option value="salud">Salud</option>
                <option value="estudio">Estudio</option>
                <option value="social">Social</option>
                <option value="ocio">Ocio</option>
            </select>
            <button type="submit">Crear hábito</button>
        </form>

        <ul id="habit-list"></ul>

        <h2>Calendario de hábitos</h2>
        <div id="calendar" class="calendar-grid"></div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
